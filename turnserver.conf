# The listening port for STUN and TURN.
listening-port=3478

# The listening port for TLS (secure TURN).
tls-listening-port=5349

# Your server's public IP address.
# IMPORTANT: Replace with your actual public IP.
# If you're running this on a cloud server (like AWS, GCP, etc.),
# you can often use the server's private IP, and the cloud provider's
# NAT will handle the rest. If you're running locally, you'll need
# your public IP address.
external-ip=192.168.1.11

# Use a static user account for authentication.
# You will use these credentials in your .env file.
user=tenjin:lalaland88

# The realm for the TURN server. This can be your domain name.
realm=192.168.1.11

# Enable verbose logging.
verbose